name: CI

on:
  push:
    branches: [main, "rewrite/**"]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @ecs-local-console/shared build
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build

  integration:
    runs-on: ubuntu-latest
    needs: check
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # moto is a pure-Python AWS mock — full ECS lifecycle, no Docker needed.
      - run: pip install "moto[server]"
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @ecs-local-console/shared build
      - name: Start moto
        run: |
          nohup python -m moto.server -p 5001 >/tmp/moto.log 2>&1 &
          for i in $(seq 1 20); do curl -sf http://localhost:5001/ && break || sleep 1; done
      - run: pnpm --filter @ecs-local-console/server test:integration
        env:
          AWS_ENDPOINT_URL: http://localhost:5001

  docker:
    runs-on: ubuntu-latest
    needs: check
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max
          tags: ecs-local-console:ci
