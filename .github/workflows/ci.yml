name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @ecs-local-console/shared build
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build

  integration:
    runs-on: ubuntu-latest
    needs: check
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # moto is a pure-Python AWS mock — full ECS lifecycle, no Docker needed.
      - run: pip install "moto[server]"
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @ecs-local-console/shared build
      - name: Start moto
        run: |
          nohup python -m moto.server -p 5001 >/tmp/moto.log 2>&1 &
          for i in $(seq 1 30); do
            curl -sf http://localhost:5001/moto-api/ >/dev/null && exit 0
            sleep 1
          done
          echo "moto did not become ready:" && cat /tmp/moto.log && exit 1
      - run: pnpm --filter @ecs-local-console/server test:integration
        env:
          AWS_ENDPOINT_URL: http://localhost:5001

  docker:
    runs-on: ubuntu-latest
    needs: check
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - name: Build image (amd64, load locally for the smoke test)
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          platforms: linux/amd64
          cache-from: type=gha
          cache-to: type=gha,mode=max
          tags: ecs-local-console:ci

      - name: Smoke-test the image
        run: |
          docker run -d --name elc -p 4570:4570 ecs-local-console:ci
          for i in $(seq 1 20); do
            curl -sf http://localhost:4570/api/health >/dev/null && ok=1 && break
            sleep 1
          done
          docker logs elc
          [ "$ok" = 1 ] || { echo "container did not answer /api/health"; exit 1; }
          curl -sf http://localhost:4570/ | grep -q "ECS Local Console"
          docker rm -f elc

      # Publish to GHCR on pushes to main and on version tags.
      - name: Log in to GHCR
        if: github.event_name == 'push'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker metadata
        if: github.event_name == 'push'
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}
            type=semver,pattern={{version}}
            type=sha,format=short

      - name: Push multi-arch image
        if: github.event_name == 'push'
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          platforms: linux/amd64,linux/arm64
          provenance: false
          cache-from: type=gha
          cache-to: type=gha,mode=max
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
