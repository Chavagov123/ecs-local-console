name: Feature request
description: Suggest something for the console
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: The problem
      description: What are you trying to do that's awkward or impossible today?
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: What you'd like
      description: A rough sketch of the behaviour or UI. Screenshots / links to how other tools do it help.
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - Clusters / services / tasks
        - Task definitions / editor
        - Reconciliation / events
        - Logs
        - Settings / endpoints
        - Backend / API
        - Other
  - type: textarea
    id: notes
    attributes:
      label: Anything else
